<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WFCrawler — seeded WFC dungeon generator</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0b0e14;
        color: #cfd6e4;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 16px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
        letter-spacing: 2px;
      }
      #hud {
        font-size: 12px;
        color: #8b93a7;
      }
      canvas {
        image-rendering: pixelated;
        border: 1px solid #2a3040;
        max-width: 100%;
        height: auto;
        background: #0b0e14;
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <h1>WFCrawler</h1>
      <div id="hud">seed: <span id="seed">?</span> — append ?seed=123 to the URL for another dungeon</div>
      <canvas id="map"></canvas>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
